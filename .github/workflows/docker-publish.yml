name: Build and publish images

on:
  # Every branch runs the tests and publishes images. Only main updates
  # :latest (what Unraid installs); any other branch is tagged with its own
  # name, so a PR can be tested on Unraid by pointing the container's
  # Repository at ghcr.io/<owner>/<image>:<branch-name>.
  push:
    branches: ["**"]
    paths:
      - "signal-bridge/**"
      - "mt5-windows/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r signal-bridge/requirements.txt pytest
      - run: python -m pytest -q signal-bridge/tests

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # legacy_image: the pre-rename (tv-mt5-bridge) name, still published
          # during the transition so existing installs keep getting updates.
          # Remove once installs have moved to the pinebridge-* images.
          - context: signal-bridge
            image: pinebridge-bridge
            legacy_image: tv-mt5-bridge-signal-bridge
          - context: mt5-windows
            image: pinebridge-mt5
            legacy_image: tv-mt5-bridge-windows
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose tags
        id: tags
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            ref_tag=latest
          else
            ref_tag=$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/-*$//')
          fi
          legacy="ghcr.io/${{ github.repository_owner }}/${{ matrix.legacy_image }}"
          {
            echo 'tags<<EOF'
            for img in "$image" "$legacy"; do
              echo "$img:$ref_tag"
              echo "$img:$GITHUB_SHA"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
