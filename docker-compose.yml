services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tv-mt5-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - signal-bridge

  signal-bridge:
    build: ./signal-bridge
    container_name: tv-mt5-signal-bridge
    restart: unless-stopped
    environment:
      - ZMQ_HOST=${ZMQ_HOST:-mt5-windows}
      - ZMQ_PORT=${ZMQ_PORT:-5555}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - REQUIRE_WEBHOOK_SECRET=${REQUIRE_WEBHOOK_SECRET:-true}
    volumes:
      - ./data/logs:/logs
    ports:
      # Only needed for local testing / an alternative reverse proxy;
      # cloudflared reaches this service over the internal compose network.
      - "5000:5000"

  # dockur/windows plus this repo's provisioning files (see
  # mt5-windows/Dockerfile): boots a real Windows VM via KVM/QEMU and
  # installs MT5 + the ZeroMQ EA on first boot. Requires /dev/kvm (Unraid
  # has it once virtualization is enabled in BIOS) and a Windows license
  # you're entitled to use -- see docs/mt5-ea-setup.md.
  mt5-windows:
    build: ./mt5-windows
    container_name: mt5-windows
    environment:
      - VERSION=11
      - RAM_SIZE=${RAM_SIZE:-8G}
      - CPU_CORES=${CPU_CORES:-2}
      - DISK_SIZE=${DISK_SIZE:-64G}
      - USERNAME=${WINDOWS_USERNAME:-Docker}
      - PASSWORD=${WINDOWS_PASSWORD}
      - MT5_LOGIN=${MT5_LOGIN}
      - MT5_PASSWORD=${MT5_PASSWORD}
      - MT5_SERVER=${MT5_SERVER}
      - MT5_SYMBOL=${MT5_SYMBOL:-EURUSD}
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"      # noVNC web viewer -- watch/control the desktop in a browser
      - "3389:3389/tcp"  # RDP, optional
      - "5555:5555/tcp"  # ZeroMQ PULL socket -- signal-bridge connects here
    volumes:
      - ./data/windows:/storage
    restart: unless-stopped
    stop_grace_period: 2m
